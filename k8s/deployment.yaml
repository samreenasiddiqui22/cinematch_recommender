apiVersion: apps/v1
kind: Deployment 

metadata:
  name: cinematch-api

spec: 
  replicas: 1 

  selector: 
    matchLabels:
      app: cinematch-api 

  template: 
    metadata:
      labels:
        app: cinematch-api
    
    spec: 
      containers:
        - name: cinematch-api 
          image: cinematch-api:latest
          imagePullPolicy: IfNotPresent 

          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health 
              port: 8000
            initialDelaySeconds: 10 
            periodSeconds: 10 

          readinessProbe:
            httpGet:
              path: /health 
              port: 8000
            initialDelaySeconds: 5 
            periodSeconds: 5